name: Offline quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - name: Set up Python for Windows native unit tests
        if: runner.os == 'Windows'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0, official release commit
        with:
          python-version: '3.12'
      - name: Run native unit tests with the committed fictional registry
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PIP_CACHE_DIR: ${{ github.workspace }}/.pip_cache
          TEMP: ${{ github.workspace }}/temp
          TMP: ${{ github.workspace }}/temp
        run: |
          New-Item -ItemType Directory -Force temp | Out-Null
          python -B -m pip install --disable-pip-version-check -r requirements-desktop.txt
          python -B scripts/test_native.py
      - run: npm run demo -- --smoke
      - run: npm run doctor -- --json
      - run: npm run check:release
